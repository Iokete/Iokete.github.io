name: Deploy Zola Site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Preserve repository assets
        shell: bash
        run: |
          if [ -d public/assets ]; then
            mkdir -p /tmp/zola-assets
            cp -a public/assets/. /tmp/zola-assets/
          fi

      - name: Build site
        run: zola build --base-url https://iokete.github.io/

      - name: Restore preserved assets into output
        shell: bash
        run: |
          if [ -d /tmp/zola-assets ]; then
            mkdir -p public/assets
            cp -a /tmp/zola-assets/. public/assets/
          fi

      - name: Disable Jekyll
        shell: bash
        run: touch public/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
